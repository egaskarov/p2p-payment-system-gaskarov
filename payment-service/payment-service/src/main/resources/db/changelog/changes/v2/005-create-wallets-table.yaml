databaseChangeLog:
  - changeSet:
      id: 005-create-wallets-table
      author: gaskarov
      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_wallets
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_wallets_user_id
                    references: users(id)
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
                    checkConstraint: balance >= 0
                  defaultValue: 0
              - column:
                  name: wallet_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
                    checkConstraint: status IN ('ACTIVE', 'FROZEN', 'CLOSED')
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
            uniqueConstraints:
              - uniqueConstraint:
                  constraintName: uk_wallets_user_id_currency
                  columnNames: user_id, currency
        - createIndex:
            indexName: idx_wallets_user_id
            tableName: wallets
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_wallets_currency
            tableName: wallets
            columns:
              - column:
                  name: currency
        - createIndex:
            indexName: idx_wallets_status
            tableName: wallets
            columns:
              - column:
                  name: status
      rollback:
        - dropTable:
            tableName: wallets