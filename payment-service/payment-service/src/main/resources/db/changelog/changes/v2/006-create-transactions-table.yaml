databaseChangeLog:
  - changeSet:
      id: 006-create-transactions-table
      author: gaskarov
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transactions
              - column:
                  name: from_wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_from_wallet_id
                    references: wallets(id)
              - column:
                  name: to_wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_to_wallet_id
                    references: wallets(id)
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
                    checkConstraint: amount > 0
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    checkConstraint: type IN ('TRANSFER', 'DEPOSIT', 'WITHDRAWAL')
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    checkConstraint: type IN ('PENDING', 'COMPLETED', 'FAILED', 'CANCELLED')
              - column:
                  name: description
                  type: text
              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_transactions_from_wallet_id
            tableName: transactions
            columns:
              - column:
                  name: from_wallet_id
        - createIndex:
            indexName: idx_transactions_to_wallet_id
            tableName: transactions
            columns:
              - column:
                  name: to_wallet_id
        - createIndex:
            indexName: idx_transactions_status
            tableName: transactions
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_transactions_created_at
            tableName: transactions
            columns:
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_transactions_idempotency_key
            unique: true
            tableName: transactions
            columns:
              - column:
                  name: idempotency_key
      rollback:
        - dropTable:
            tableName: transactions